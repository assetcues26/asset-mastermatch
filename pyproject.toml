[project]
name = "asset-master-match"
version = "0.1.0"
description = "Azure Function — Pinecone master-data match for asset create"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["asset_master_match", "tests"]
extend-exclude = [".venv", "venv", ".python_packages"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length handled by formatter preference; prompts/logs can be long
]

[tool.ruff.lint.isort]
known-first-party = ["asset_master_match"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
